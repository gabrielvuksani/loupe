name: Publish loupe-cli

# Publishes packages/connected to npm as loupe-cli via OIDC trusted publishing
# (no token) when a version tag is pushed (e.g. v0.1.1) or on manual dispatch.
# Bump packages/connected/package.json, then tag and push:
#   git tag v0.1.1 && git push origin v0.1.1
#
# Trusted publishing is configured on npmjs.com for loupe-cli against this repo
# and the workflow file `publish.yml`. Requirements: id-token: write on the job,
# npm CLI >= 11.5.1, and Node >= 22.14. pnpm 10.x delegates publish to npm, which
# performs the OIDC exchange; pnpm 11 is avoided (its native OIDC path regressed).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Resolve package version
        id: ver
        run: echo "version=$(node -p "require('./packages/connected/package.json').version")" >> "$GITHUB_OUTPUT"

      # Idempotent: re-running must not fail on an already-published version.
      - name: Check the registry
        id: published
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if npm view "loupe-cli@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "loupe-cli@$VERSION is already published; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # OIDC trusted publishing needs npm CLI >= 11.5.1; pnpm 10 delegates to it.
      - name: Update npm for OIDC
        if: steps.published.outputs.exists == 'false'
        run: npm install -g npm@latest

      # prepack rebuilds the bundle + extension; pnpm rewrites the workspace dep
      # and delegates to npm, which authenticates via OIDC (no token needed).
      - name: Publish loupe-cli
        if: steps.published.outputs.exists == 'false'
        run: pnpm --filter loupe-cli publish --no-git-checks --access public
