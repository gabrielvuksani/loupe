name: Publish loupe-cli

# Publishes packages/connected to npm as loupe-cli when a version tag is pushed
# (e.g. v0.1.1), or on manual dispatch. Bump the version in
# packages/connected/package.json first, then tag and push:
#   git tag v0.1.1 && git push origin v0.1.1
#
# Requires an NPM_TOKEN repo secret: an npm Automation or Granular access token
# with publish rights (these bypass 2FA, which interactive passkeys cannot do in
# CI). Add it under Settings -> Secrets and variables -> Actions -> New secret.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Resolve package version
        id: ver
        run: echo "version=$(node -p "require('./packages/connected/package.json').version")" >> "$GITHUB_OUTPUT"

      # Idempotent: re-tagging or re-running must not fail on an already-published
      # version. Only publish when this version is not yet on the registry.
      - name: Check the registry
        id: published
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if npm view "loupe-cli@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "loupe-cli@$VERSION is already published; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # prepack rebuilds the self-contained bundle, then pnpm publishes it.
      - name: Publish loupe-cli
        if: steps.published.outputs.exists == 'false'
        run: pnpm --filter loupe-cli publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
