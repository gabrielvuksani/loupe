name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # pnpm/action-setup takes the pnpm version from the packageManager field in
      # package.json (pnpm@10.34.3). Do NOT also pass `version:` here, or it fails
      # with ERR_PNPM_BAD_PM_VERSION ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Typecheck engine
        run: pnpm --filter @loupe/engine exec tsc --noEmit

      - name: Typecheck connected
        run: pnpm --filter loupe-cli exec tsc --noEmit

      - name: Typecheck extension
        run: pnpm --filter @loupe/extension exec tsc --noEmit

  # MV3 extension service workers require a headed Chromium instance, so this
  # job is best-effort: it runs under a virtual display via xvfb and is marked
  # non-blocking so a flaky headed run never gates the test job above.
  integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter loupe-cli exec playwright install --with-deps chromium

      # The extension e2e tests load the built MV3 bundle from .output/chrome-mv3.
      - name: Build extension
        run: pnpm --filter @loupe/extension build

      - name: Integration tests
        run: xvfb-run -a pnpm test:integration
